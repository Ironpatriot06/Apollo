services:
  postgres:
    image: postgres:17
    container_name: apollo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apollo
      POSTGRES_USER: apollo
      POSTGRES_PASSWORD: apollo
    ports:
      - "5432:5432"
    volumes:
      - apollo_postgres_data:/var/lib/postgresql/data

volumes:
  apollo_postgres_data:
