[project]
name = "apollo-sdk"
version = "0.1.0"
description = "Backend request replay SDK for Apollo."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Ratish Kapoor", email = "ratishkapoor5@gmail.com" }
]

dependencies = [
    "fastapi>=0.141.1",
    "greenlet>=3.0.0",
    "httpx>=0.28.1",
    "sqlalchemy>=2.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/apollo"]
